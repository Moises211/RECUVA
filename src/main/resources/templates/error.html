<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error en la Aplicación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #fdf9f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .error-container {
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .error-container h1 {
            color: #dc3545;
            font-size: 2.5em;
            margin-bottom: 15px;
        }
        .error-container p {
            color: #6c757d;
            font-size: 1.1em;
            margin-bottom: 25px;
        }
        .error-container .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }
        .error-container .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>¡Oops! Ha Ocurrido un Error</h1>
        <p>Parece que algo salió mal. Estamos trabajando para solucionarlo.</p>
        
        <!-- Puedes mostrar un mensaje de error más específico si se pasa al modelo -->
        <p th:if="${message}" th:text="${message}" style="color: #333; font-weight: bold;"></p>
        <p th:if="${error}" th:text="${error}" style="color: #dc3545;"></p>
        <p th:if="${status}" th:text="'Código de estado: ' + ${status}" style="color: #555;"></p>

        <a th:href="@{/dashboard}" class="btn btn-primary">Volver al Dashboard</a>
        <a th:href="@{/resource}" class="btn btn-secondary mt-2">Ver Recursos</a>
    </div>
</body>
</html>
