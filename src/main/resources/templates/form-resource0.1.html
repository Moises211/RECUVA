<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title th:text="${recurso.id != null ? 'Editar Recurso' : 'Agregar Nuevo Recurso'}"></title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #fdf9f3;
            margin: 0;
            padding: 0;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 30px 50px;
        }

        .left-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .left-header img {
            width: 50px;
        }

        .left-header h1 {
            font-size: 18px;
            margin: 5px 0;
            color: #0d0d0d;
            font-weight: bold;
        }

        .dropdown-toggle {
            font-size: 24px;
            cursor: pointer;
            color: #888;
            margin-top: -5px;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            margin-top: 8px;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            width: 160px;
            z-index: 100;
        }

        .dropdown-menu a {
            display: block;
            padding: 10px;
            text-decoration: none;
            color: #333;
        }

        .dropdown-menu a:hover {
            background-color: #f0f0f0;
        }

        .right-header {
            display: flex;
            align-items: center;
        }

        .right-header img {
            width: 30px;
            margin-right: 10px;
        }

        .right-header span {
            font-size: 18px;
            color: #444;
            margin-right: 20px;
        }

        .menu-icon {
            font-size: 30px;
            color: #aaa;
            cursor: pointer;
        }

        .container {
            margin-top: 20px;
            max-width: 800px;
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .form-label {
            font-weight: bold;
        }
        .form-check-label {
            margin-left: 5px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="left-header">
            <img src="/logo.jpg" alt="Logo"> <!-- Ruta corregida -->
            <h1>RECUVA</h1>
            <div class="dropdown-toggle" onclick="toggleMenu()">▼</div>
            <div class="dropdown-menu" id="dropdownMenu">
                <a href="/dashboard">Principal</a>
                <a href="/resource">Recursos</a>
                <a href="/reports">Reportes</a>
                <a href="#" id="logout-link">Cerrar sesión</a>
            </div>
        </div>
    </div>

    <div class="container">
        <h2 class="mb-4" th:text="${recurso.id != null ? 'Editar Recurso' : 'Agregar Nuevo Recurso'}"></h2>

        <form th:action="${recurso.id != null ? '/editResource/' + recurso.id : '/resourceNew'}" th:object="${recurso}" method="post">
            <div class="mb-3">
                <label for="titulo" class="form-label">Título:</label>
                <input type="text" class="form-control" id="titulo" th:field="*{titulo}" required>
            </div>
            <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción:</label>
                <textarea class="form-control" id="descripcion" th:field="*{descripcion}" rows="3" required></textarea>
            </div>
            <div class="mb-3">
                <label for="tipoDoc" class="form-label">Tipo de Documento:</label>
                <input type="text" class="form-control" id="tipoDoc" th:field="*{tipoDoc}" required>
            </div>
            <div class="mb-3">
                <label for="url" class="form-label">URL:</label>
                <input type="url" class="form-control" id="url" th:field="*{url}" required>
            </div>
            
            <div class="mb-3">
                <label for="subject" class="form-label">Materia:</label>
                <select class="form-control" id="subject" th:field="*{subject}" required>
                    <option th:each="subj : ${subjects}" 
                            th:value="${subj.id}" 
                            th:text="${subj.materia}"
                            th:selected="${recurso.subject != null and recurso.subject.id == subj.id}">
                    </option>
                </select>
            </div>

            <!-- Campo de Visibilidad (Radio Buttons) - ¡CORRECCIÓN ROBUSTA AQUÍ! -->
            <div class="mb-3">
                <label class="form-label">Visibilidad:</label>
                <div class="form-check" th:each="option : ${visibilityOptions}">
                    <input class="form-check-input" type="radio" 
                           th:field="*{visibilidad}"  
                           th:value="${option}"      
                           th:id="${#ids.seq('visibilidad')}" 
                           required>
                    <label class="form-check-label" th:for="${#ids.prev('visibilidad')}" th:text="${option.toString().replace('_', ' ')}">
                        <!-- #ids.prev() obtiene el último ID generado por #ids.seq() -->
                    </label>
                </div>
            </div>

            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                <button type="submit" class="btn btn-primary me-md-2" th:text="${recurso.id != null ? 'Actualizar Recurso' : 'Guardar Recurso'}"></button>
                <a th:href="@{/resource}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>

    <form th:action="@{/logout}" method="post" id="logoutForm" style="display: none;"></form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleMenu() {
            const menu = document.getElementById('dropdownMenu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        document.addEventListener('click', function(event) {
            const menu = document.getElementById('dropdownMenu');
            const toggle = document.querySelector('.dropdown-toggle');
            if (!menu.contains(event.target) && !toggle.contains(event.target)) {
                menu.style.display = 'none';
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            const logoutLink = document.getElementById('logout-link');
            if (logoutLink) {
                logoutLink.addEventListener('click', function(event) {
                    event.preventDefault();
                    document.getElementById('logoutForm').submit();
                });
            }
        });
    </script>
</body>
</html>
