<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Formulario de Materia</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    </head>
    <body class="container mt-4">
        <div class="text-center mb-4">
            <h1>Gestion de Calificacion Recursos</h1>
        </div>
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Lista Ratings</h5>
            </div>
            <div class="card-body">
                <table class="table table-bordered table-striped table-striped">
                    <thead class="thead-dark">
                        <tr>
                            <th>Calificacion</th>
                            <th>Calificador</th>
                            <th>Materia</th>
                            <th>Recurso</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="ratings: ${ratings}">
                            <td th:text="${ratings.calificacion}"></td>
                            <td th:text="${ratings.user.name}"></td>
                            <td th:text="${ratings.resource?.subject?.materia ?: ''}"></td>
                            <!--td th:text="${ratings.resource.titulo} ?: '' +'| |'+ ${ratings.resource.fechaCreacion} ?: '' "></td-->
                            <td th:text="${ratings.resource?.titulo ?: ''}  "></td>
                            <td>
                                <a class="btn btn-sm btn-info" th:href="@{'/editRatings/' + ${ratings.id}}">Editar</a>
                                <a class="btn btn-sm btn-danger" th:href="@{'/deleteRatings/' + ${ratings.id}}"
                                   onclick="return confirm('¿Eliminar este recurso permanentemente?')">Eliminar</a>
                                <!-- a class="btn btn-sm btn-secondary" th:href="@{'/detalles/' + ${recurso.id}}">Ver</a -->
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div class="text-end mt-3">
                    <a class="btn btn-success" th:href="@{/ratingsNew}">Agregar Recurso</a>
                </div>
            </div>
        </div>
    </body>
</html>
