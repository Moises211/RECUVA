<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Subir recurso - RECUVA</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f9f4ea;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    .logo-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 10px;
      position: relative;
    }

    .logo-section img {
      width: 60px;
      height: auto;
    }

    .logo-title {
      font-size: 20px;
      font-weight: bold;
      color: #1f1f1f;
      margin-top: 5px;
    }

    .dropdown-toggle {
      font-size: 18px;
      font-weight: bold;
      color: #555;
      cursor: pointer;
      margin-top: 6px;
      user-select: none;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      margin-top: 8px;
      background-color: white;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      width: 180px;
      z-index: 100;
    }

    .dropdown-menu a {
      display: block;
      padding: 10px;
      text-decoration: none;
      color: #333;
    }

    .dropdown-menu a:hover {
      background-color: #f0f0f0;
    }

    .upload-title {
      display: flex;
      align-items: center;
      font-size: 16px;
      margin-top: 20px;
      margin-bottom: 20px;
      gap: 10px;
    }

    .upload-title::before {
      content: "⤴️";
      font-size: 20px;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: normal;
    }

    input[type="text"],
    select,
    input[type="file"] {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      border: 2px solid #333;
      border-radius: 10px;
      background-color: white;
    }

    input[type="file"] {
      padding: 6px;
    }

    button {
      display: block;
      margin: 20px auto 0;
      padding: 10px 30px;
      font-size: 15px;
      background-color: #3f88f7;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background-color: #2e70d4;
    }

    .menu-icon {
      position: absolute;
      top: 25px;
      right: 30px;
      font-size: 26px;
      color: #888;
      cursor: pointer;
    }

    @media screen and (max-width: 600px) {
      .container {
        padding: 15px;
      }

      .menu-icon {
        right: 15px;
      }
    }
  </style>
</head>
<body class="container mt-5">

  <div class="menu-icon">≡</div>

  <div class="container">
    <!-- Sección de Logo + Flecha -->
    <div class="logo-section">
      <img src="logo.jpg" alt="Logo RECUVA">
      <div class="logo-title">RECUVA</div>
      <div class="dropdown-toggle" onclick="toggleMenu()">CLICK MENU</div>

      <!-- Menú Desplegable -->
      <div class="dropdown-menu" id="dropdownMenu">
        <a href="/dashboard">Principal</a>    
        <a href="#" id="logout-link">Cerrar sesión</a>
      </div>
    </div>

    <!-- Formulario -->
    <h2 th:text="${recurso.id != null} ? 'Editar Recurso' : 'Nueva Recurso'"></h2>
    
    <form th:action="@{/resourceNew}" th:object="${recurso}" method="post">
        <input type="hidden" th:field="*{id}" />
        
        <div class="mb-3">
            <label for="titulo" class="form-label">Titulo</label>
            <input type="text" th:field="*{titulo}" class="form-control" required>
        </div>
        
        <div class="mb-3">
            <label for="descripcion" class="form-label">Descripcion</label>
            <input type="text" th:field="*{descripcion}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="tipoDoc" class="form-label">Tipo de Documento</label>
            <input type="text" th:field="*{tipoDoc}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="url" class="form-label">Enlace a Documento</label>
            <input type="text" th:field="*{url}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="fechaCreacion" class="form-label">fechaCreacion</label>
            <input type="text" th:field="*{fechaCreacion}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="subject" class="form-label">Materia</label>
            <input type="text" th:field="*{subject}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="user" class="form-label">Autor</label>
            <input type="text" th:field="*{user}" class="form-control" required>
        </div>
        
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="/resource" class="btn btn-secondary">Cancelar</a>
    </form>

    <form th:action="@{/logout}" method="post" id="logoutForm" style="display: none;">
        </form>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const logoutLink = document.getElementById('logout-link');
            if (logoutLink) {
                logoutLink.addEventListener('click', function(event) {
                    event.preventDefault(); // Previene la acción por defecto del enlace (navegar a #)
                    document.getElementById('logoutForm').submit(); // Envía el formulario de logout
                });
            }
        });
    </script>

  <script>
    function toggleMenu() {
      const menu = document.getElementById('dropdownMenu');
      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    }

    // Cierra el menú si se hace clic fuera
    document.addEventListener('click', function(event) {
      const menu = document.getElementById('dropdownMenu');
      const toggle = document.querySelector('.dropdown-toggle');
      if (!menu.contains(event.target) && !toggle.contains(event.target)) {
        menu.style.display = 'none';
      }
    });
  </script>

</body>
</html>
