<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>RECUVA - Mis recursos</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #fdf9f3;
      margin: 0;
      padding: 0;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 30px 50px;
    }

    .left-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .left-header img {
      width: 50px;
    }

    .left-header h1 {
      font-size: 18px;
      margin: 5px 0;
      color: #0d0d0d;
      font-weight: bold;
    }

    .dropdown-toggle {
      font-size: 24px;
      cursor: pointer;
      color: #888;
      margin-top: -5px;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      margin-top: 8px;
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      width: 160px;
      z-index: 100;
    }

    .dropdown-menu a {
      display: block;
      padding: 10px;
      text-decoration: none;
      color: #333;
    }

    .dropdown-menu a:hover {
      background-color: #f0f0f0;
    }

    .right-header {
      display: flex;
      align-items: center;
    }

    .right-header img {
      width: 30px;
      margin-right: 10px;
    }

    .right-header span {
      font-size: 18px;
      color: #444;
      margin-right: 20px;
    }

    .menu-icon {
      font-size: 30px;
      color: #aaa;
      cursor: pointer;
    }

    table {
      margin: 50px auto;
      border-collapse: collapse;
      width: 85%;
      max-width: 1000px;
      text-align: center;
    }

    th {
      background-color: #8faaff;
      color: #000;
      font-weight: bold;
      padding: 16px;
      border: none;
    }

    td {
      background-color: #e5ebff;
      color: #000;
      padding: 14px;
      border: none;
    }

    a {
      color: #2a7de1;
      text-decoration: underline;
    }

    a:hover {
      color: #1a5fb4;
    }

    @media screen and (max-width: 600px) {
      .header {
        flex-direction: column;
        align-items: center;
        padding: 15px;
      }

      .right-header {
        margin-top: 10px;
      }

      table {
        width: 95%;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="left-header">
      <img src="logo.jpg" alt="Logo">
      <h1>RECUVA</h1>
      <div class="dropdown-toggle" onclick="toggleMenu()">▼</div>
      <div class="dropdown-menu" id="dropdownMenu">
        <a href="#">Mis recursos</a>
        <a href="#">Subir recurso</a>
        <a href="#">Cerrar sesión</a>
      </div>
    </div>

    <div class="right-header">
      <img src="libro.jpg" alt="Libro">
      <span>Mis recursos</span>
      <div class="menu-icon">≡</div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Título</th>
        <th>Materia</th>
        <th>Tipo</th>
        <th>Descargar</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Cálculo diferencial</td>
        <td>Matemática</td>
        <td>PDF</td>
        <td><a href="#">Descargar</a></td>
      </tr>
      <tr>
        <td>Segunda Guerra Mundial</td>
        <td>Historia</td>
        <td>Enlace</td>
        <td><a href="#">Descargar</a></td>
      </tr>
      <tr>
        <td>Estructura atómica</td>
        <td>Ciencias</td>
        <td>Video</td>
        <td><a href="#">Descargar</a></td>
      </tr>
    </tbody>
  </table>

  <script>
    function toggleMenu() {
      const menu = document.getElementById('dropdownMenu');
      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    }

    document.addEventListener('click', function(event) {
      const menu = document.getElementById('dropdownMenu');
      const toggle = document.querySelector('.dropdown-toggle');
      if (!menu.contains(event.target) && !toggle.contains(event.target)) {
        menu.style.display = 'none';
      }
    });
  </script>

</body>
</html>
