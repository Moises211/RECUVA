<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Formulario de Usuario</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    </head>
    <body class="container mt-4">
        <div class="text-center mb-4">
            <h1>Gestion de Usuarios</h1>
        </div>
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Lista Ratings</h5>
            </div>
            <div class="card-body">
                <!--tabla de Usuarios-->
                <table class="table table-bordered table-striped table-striped">
                    <thead class="thead-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>E-mail</th>                    
                            <th>Rol</th>
                        </tr>                
                    </thead>
                    <tbody>
                        <tr th:each="usuario : ${users}">
                            <td th:text="${usuario.id}"></td>
                            <td th:text="${usuario.name}"></td>
                            <td th:text="${usuario.email}"></td>
                            <td th:text="${usuario.role == TRUE} ? 'ALUMNO' : 'TUTOR'"></td>
                            <td>
                                <a class="btn btn-sm btn-info" th:href="@{'/editUser/' + ${usuario.id}}">Editar</a>
                                <a class="btn btn-sm btn-danger" th:href="@{'/deleteUser/' + ${usuario.id}}"
                                        onclick="return confirm('¿Eliminar este recurso permanentemente?')">Eliminar</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div class="text-end mt-3">
                    <a class="btn btn-success" th:href="@{/usersNew}">Agregar Recurso</a>
                </div>
            </div>
        </div>
        
    </body>
</html>
