<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Formulario de Usuario</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    </head>
    <body class="container mt-5">
        
        <h2 th:text="${usuario.id != null} ? 'Editar Usuario' : 'Nuevo Usuario'"></h2>

        <form th:action="@{/usersNew}" th:object="${usuario}" method="post">
            <input type="hidden" th:field="*{id}"/>
            <div class="mb-3">
                <label>Nombre</label>
                <input type="text" th:field="*{name}" class="form-control" required/>
            </div>
            <div class="mb-3">
                <label>e-mail</label>
                <input type="email" th:field="*{email}" class="form-control" required/>
            </div>
            <div class="mb-3">
                <label>Contraseña</label>
                <input type="text" th:value=" '••••••••' " class="form-control"   th:field="*{pass}"/>
                <!--input type="hidden" th:field="*{pass}" /--> </div>
                <!--input type="password"  th:field="*{pass}" class="form-control" required/-->
            </div>
            <div class="mb-3">
                <label>Rol</label>
                <select class="form-select" th:field="*{role}">
                    <option value="1">Alumno</option>
                    <option value="0" selected>Tutor</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="/users" class="btn btn-secondary">Cancelar</a>
        </form>
    </body>
</html>
