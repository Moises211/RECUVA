<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Recuva</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f4ea;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .dashboard-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 600px;
        }
        h1 {
            color: #1aa9ff;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.1em;
            margin-bottom: 10px;
        }
        .user-info {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        .logout-button {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            background-color: #ff4d4d;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .logout-button:hover {
            background-color: #e60000;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <h1>Bienvenido al Dashboard de Recuva</h1>

        <div class="user-info">
            <p>Has iniciado sesión como:</p>
            <p><strong>Nombre:</strong> <span th:text="${userName}">Usuario Desconocido</span></p>
            <p><strong>Email:</strong> <span th:text="${userEmail}">Email Desconocido</span></p>
            </div>

        <p>¡Este es tu espacio personal!</p>

        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-button">Cerrar Sesión</button>
        </form>
    </div>
</body>
</html>
