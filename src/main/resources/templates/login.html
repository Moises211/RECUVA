<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Recuva</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #f9f4ea;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-container {
      text-align: center;
      width: 100%;
      max-width: 350px;
      padding: 20px;
    }

    .logo {
      width: 100px;
      margin-bottom: 20px;
    }

    .welcome-text {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    /* Puedes mantener esto si no quieres que aparezcan campos de input,
       pero la solución ideal es eliminarlos del HTML si no se usan. */
    .input-group {
      display: none; /* Oculta los campos de usuario y contraseña */
    }

    .login-button {
      width: 100%;
      padding: 12px;
      background-color: #1aa9ff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.3s;
    }

    .login-button:hover {
      background-color: #0d8de6;
    }

    /* Ocultamos el enlace de "Olvidaste tu contraseña" ya que Auth0 lo maneja */
    .forgot {
      display: none; /* Oculta el enlace de "Olvidaste tu contraseña" */
    }
  </style>
</head>
<body>

  <div class="login-container">
    <img src="logo.jpg" alt="Logo Recuva" class="logo">
    <div class="welcome-text">Bienvenid@</div>

    <form th:action="@{/oauth2/authorization/auth0}" method="GET">
      <button type="submit" class="login-button">Iniciar Sesión con Auth0</button>
    </form>

    <a href="#" class="forgot">¿Olvidaste tu contraseña?</a>
  </div>

</body>
</html>
