<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"> <head>
    <meta charset="UTF-8">
    <title>Lista de Materias</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .modal-body textarea {
            min-height: 120px; /* Altura mínima para el área de texto */
        }
    </style>
</head>
<body class="container mt-5">
    <h2>Materias Registradas</h2>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <a href="/subjectNew" class="btn btn-success mb-3" sec:authorize="hasRole('ADMIN')">Agregar Nueva Materia</a>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Código</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="materia : ${subject}">
                <td th:text="${materia.id}"></td>
                <td th:text="${materia.materia}"></td>
                <td th:text="${materia.descripcion}"></td>
                <td>
                    <a th:href="@{/editSubject/{id}(id=${materia.id})}" class="btn btn-warning btn-sm" sec:authorize="hasRole('ADMIN')">Editar</a>
                    <a th:href="@{/deleteSubject/{id}(id=${materia.id})}" class="btn btn-danger btn-sm"
                       onclick="return confirm('¿Estás seguro de eliminar esta materia?')" sec:authorize="hasRole('ADMIN')">Eliminar</a>
                    
                    <button type="button" class="btn btn-info btn-sm"
                            data-bs-toggle="modal" data-bs-target="#reportModal"
                            th:data-resource-id="${materia.id}"
                            th:data-resource-name="${materia.materia}"
                            sec:authorize="isAuthenticated()">
                        Reportar
                    </button>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="modal fade" id="reportModal" tabindex="-1" aria-labelledby="reportModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="reportModalLabel">Enviar Reporte para <span id="modalResourceName"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form th:action="@{/reports/submit-from-modal}" method="post">
                    <div class="modal-body">
                        <input type="hidden" id="resourceIdInput" name="resourceId" value="">
                        
                        <div class="mb-3">
                            <label for="motive" class="form-label">Descripción del Problema:</label>
                            <textarea class="form-control" id="motive" name="motive" rows="5" required></textarea>
                            <div class="form-text">Por favor, sea lo más descriptivo posible.</div>
                        </div>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                        <button type="submit" class="btn btn-primary">Enviar Reporte</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script th:inline="javascript">
        // JavaScript para capturar el ID de la materia y pasarlo al modal
        var reportModal = document.getElementById('reportModal');
        reportModal.addEventListener('show.bs.modal', function (event) {
            // Botón que disparó el modal
            var button = event.relatedTarget; 

            // Extraer información de los atributos data-*
            var resourceId = button.getAttribute('data-resource-id');
            var resourceName = button.getAttribute('data-resource-name');

            // Actualizar el contenido del modal
            var modalTitle = reportModal.querySelector('.modal-title #modalResourceName');
            var resourceIdInput = reportModal.querySelector('.modal-body #resourceIdInput');
            
            modalTitle.textContent = resourceName; // Muestra el nombre de la materia en el título
            resourceIdInput.value = resourceId; // Establece el ID de la materia en el campo oculto
        });
    </script>
</body>
</html>
