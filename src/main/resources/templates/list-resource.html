<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Recursos Académicos</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #fdf9f3;
      margin: 0;
      padding: 0;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 30px 50px;
    }

    .left-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .left-header img {
      width: 50px;
    }

    .left-header h1 {
      font-size: 18px;
      margin: 5px 0;
      color: #0d0d0d;
      font-weight: bold;
    }

    .dropdown-toggle {
      font-size: 24px;
      cursor: pointer;
      color: #888;
      margin-top: -5px;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      margin-top: 8px;
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      width: 160px;
      z-index: 100;
    }

    .dropdown-menu a {
      display: block;
      padding: 10px;
      text-decoration: none;
      color: #333;
    }

    .dropdown-menu a:hover {
      background-color: #f0f0f0;
    }

    .right-header {
      display: flex;
      align-items: center;
    }

    .right-header img {
      width: 30px;
      margin-right: 10px;
    }

    .right-header span {
      font-size: 18px;
      color: #444;
      margin-right: 20px;
    }

    .menu-icon {
      font-size: 30px;
      color: #aaa;
      cursor: pointer;
    }

    table {
      margin: 50px auto;
      border-collapse: collapse;
      width: 85%;
      max-width: 1000px;
      text-align: center;
    }

    th {
      background-color: #8faaff;
      color: #000;
      font-weight: bold;
      padding: 16px;
      border: none;
    }

    td {
      background-color: #e5ebff;
      color: #000;
      padding: 14px;
      border: none;
    }

    a {
      color: #2a7de1;
      text-decoration: underline;
    }

    a:hover {
      color: #1a5fb4;
    }

    @media screen and (max-width: 600px) {
      .header {
        flex-direction: column;
        align-items: center;
        padding: 15px;
      }

      .right-header {
        margin-top: 10px;
      }

      table {
        width: 95%;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="left-header">
      <img src="logo.jpg" alt="Logo">
      <h1>RECUVA</h1>
      <div class="dropdown-toggle" onclick="toggleMenu()">▼</div>
      <div class="dropdown-menu" id="dropdownMenu">
        <a href="/dashboard">Principal</a>    
        <a href="#" id="logout-link">Cerrar sesión</a>
      </div>
    </div>

    <div class="container mt-4">
        <div class="text-center mb-4">
            <h1>Gestión de Recursos Académicos</h1>
        </div>
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Lista de Recursos</h5>
            </div>
            <div class="card-body">
                <!-- Tabla de recursos -->
                <table class="table table-bordered table-striped table-hover">
                    <thead class="thead-dark">
                        <tr>
                            <th>ID</th>
                            <th>Título</th>
                            <th>Tipo</th>
                            <th>Descripcion</th>
                            <th>URL</th>
                            <th>Año</th>
                            <th>Materia</th>
                            <th>Creador</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="recurso : ${resources}">
                            <td th:text="${recurso.id}"></td>
                            <td th:text="${recurso.titulo}"></td>
                            <td th:text="${recurso.descripcion}"></td>
                            <td th:text="${recurso.tipoDoc}"></td>
                            <td th:text="${recurso.url}"></td>
                            <td th:text="${recurso.fechaCreacion}"></td>
                            <td th:text="${recurso.subject.materia}"></td>
                            <td th:text="${recurso.user.name}"></td>
                            <td>
                                <a class="btn btn-sm btn-info" th:href="@{'/editResource/' + ${recurso.id}}">Editar</a>
                                <a class="btn btn-sm btn-danger" th:href="@{'/deleteResource/' + ${recurso.id}}"
                                   onclick="return confirm('¿Eliminar este recurso permanentemente?')">Eliminar</a>
                                <!-- a class="btn btn-sm btn-secondary" th:href="@{'/detalles/' + ${recurso.id}}">Ver</a -->
                            </td>
                        </tr>
                    </tbody>
                </table>
                <!-- Botón para agregar nuevo recurso -->
                <div class="text-end mt-3">
                    <a class="btn btn-success" th:href="@{/resourceNew}">Agregar Recurso</a>
                </div>
            </div>
        </div>
    </div>
    <form th:action="@{/logout}" method="post" id="logoutForm" style="display: none;">
        </form>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const logoutLink = document.getElementById('logout-link');
            if (logoutLink) {
                logoutLink.addEventListener('click', function(event) {
                    event.preventDefault(); // Previene la acción por defecto del enlace (navegar a #)
                    document.getElementById('logoutForm').submit(); // Envía el formulario de logout
                });
            }
        });
    </script>
    
  <script>
    function toggleMenu() {
      const menu = document.getElementById('dropdownMenu');
      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    }

    document.addEventListener('click', function(event) {
      const menu = document.getElementById('dropdownMenu');
      const toggle = document.querySelector('.dropdown-toggle');
      if (!menu.contains(event.target) && !toggle.contains(event.target)) {
        menu.style.display = 'none';
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
