<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Formulario de Calificacion de Recursos</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    </head>
    <body class="container mt-5">
        <h2 th:text="${ratings.id != null} ? 'Editar Calificacion' : 'Nuevo Calificacion'"></h2>
        <div class="card shadow">
            <div class="card-body">
                <form th:action="@{/ratingsNew}" th:object="${ratings}" method="post">
                    <input type="hidden" th:field="*{id}"/>
        
                    <div class="mb-3">
                        <label for="ratings" class="form-label">Calificacion</label>
                        <input type="number" th:field="*{calificacion}" class="form-control" required/>
                    </div>
        
                    <!--div class="mb-3">
                        <label for="ratings" class="form-label">Calificador</label>
                        <input type="number" th:field="*{user}" class="form-control" required/>
                    </div-->
                    <div class="mb-3">
                        <label for="ratings" class="form-label">Calificador</label>
                        <select class="form-select" th:field="*{user}">
                            <option value="0">Select Option</option>
                            <option th:each="users: ${users}" th:value="${users.id}" th:text="${users.name}"></option>
                        </select>
                    </div>
        
                    <div class="mb-3">
                        <label for="ratings" class="form-label">Recurso</label>
                        <input type="number" th:field="*{resource}" class="form-control" required/>
                    </div>
        
                    
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a href="/ratings" class="btn btn-secondary">Cancelar</a>
                    
                </form>
            </div>
            
        </div>        
    </body>
</html>
